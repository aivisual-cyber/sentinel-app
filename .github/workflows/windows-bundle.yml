name: Windows offline bundle

# Builds the offline USB bundle on Windows, installs it for real (services, ACLs, health), feeds a real
# fire image as a camera, checks that alerts are raised, uninstalls, and publishes the bundle zip.
on:
  push:
    paths:
      - 'backend/**'
      - 'deploy/windows/**'
      - 'scripts/build_windows_bundle.py'
      - 'scripts/gpu_check.py'
      - 'scripts/watchdog.py'
      - 'requirements-windows.txt'
      - 'rabahdev_best.onnx'
      - 'src/**'
      - '.github/workflows/windows-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build offline bundle
        shell: pwsh
        run: |
          python scripts/build_windows_bundle.py --out build/Sentinel-Windows-x64

      - name: Installer refuses unsafe folder layouts (changes nothing)
        shell: powershell
        run: |
          Set-Location build\Sentinel-Windows-x64
          $bundle = (Get-Location).Path
          $cases = @(
            @{ InstallDir = $bundle; DataDir = 'C:\SentinelCiData' },                 # program into the bundle folder
            @{ InstallDir = 'C:\SentinelCi'; DataDir = 'C:\SentinelCi\DATA' },        # data inside program folder
            @{ InstallDir = 'C:\'; DataDir = 'C:\SentinelCiData' },                   # drive root
            @{ InstallDir = $env:windir; DataDir = 'C:\SentinelCiData' }              # folder with other files
          )
          foreach ($c in $cases) {
            powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoShortcut -InstallDir $c.InstallDir -DataDir $c.DataDir
            if ($LASTEXITCODE -ne 1) { throw "installer accepted unsafe layout: $($c.InstallDir) / $($c.DataDir)" }
          }
          if (Get-Service SentinelEngine -ErrorAction SilentlyContinue) { throw 'a refused install created a service' }
          'unsafe layouts refused OK'
          exit 0   # the refused installs leave LASTEXITCODE=1, which would fail this step

      - name: Install from bundle (Windows PowerShell 5.1, as the target machine would)
        shell: powershell
        run: |
          Set-Location build\Sentinel-Windows-x64
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoShortcut
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify services, security and detection
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Service SentinelEngine, SentinelWatchdog | Format-Table Name, Status, StartType
          if ((Get-Service SentinelEngine).Status -ne 'Running') { throw 'SentinelEngine not running' }
          if ((Get-Service SentinelWatchdog).Status -ne 'Running') { throw 'SentinelWatchdog not running' }
          $token = (Get-Content "$env:ProgramData\Sentinel\api_token" -Raw).Trim()
          $h = @{ Authorization = "Bearer $token" }
          $api = 'http://127.0.0.1:8765/api'
          $health = Invoke-RestMethod "$api/health"
          "health: $($health.status) inference: $($health.inference.device)"
          try { Invoke-RestMethod "$api/cameras" | Out-Null; throw 'API accepted a request without token' }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } ; 'no token -> 401 OK' }
          $ui = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing
          if ($ui.StatusCode -ne 200) { throw 'UI not served' }
          (icacls "$env:ProgramData\Sentinel\api_token") -join "`n"
          # a real fire photo as the camera source
          Copy-Item tests\fixtures\fire_1.jpg "$env:ProgramData\Sentinel\data\fire_cam.jpg"
          $body = @{ camera_id = 'ci_fire'; rtsp_url = "$env:ProgramData\Sentinel\data\fire_cam.jpg"; name = 'CI fire' } | ConvertTo-Json
          Invoke-RestMethod "$api/cameras/add" -Method Post -Headers $h -Body $body -ContentType 'application/json'
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 3
            $r = Invoke-RestMethod "$api/report?days=1" -Headers $h
            if ($r.overall.alerts -ge 1) { $ok = $true; break }
          }
          Invoke-RestMethod "$api/report?days=1" -Headers $h | ConvertTo-Json -Depth 5
          if (-not $ok) { throw 'No alert raised for a real fire image' }
          # restart resilience: kill the engine process, the service must come back
          Stop-Process -Name python -Force -ErrorAction SilentlyContinue
          Start-Sleep 20
          $health = Invoke-RestMethod "$api/health"
          "after crash: $($health.status)"
          if (-not $health.detector_loaded) { throw 'Engine did not recover after crash' }

      - name: Upgrade in place keeps key and cameras
        shell: powershell
        run: |
          $before = (Get-Content "$env:ProgramData\Sentinel\api_token" -Raw).Trim()
          Set-Location build\Sentinel-Windows-x64
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoShortcut
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content "$env:ProgramData\Sentinel\api_token" -Raw).Trim() -ne $before) { throw 'access key changed on upgrade' }
          $h = @{ Authorization = "Bearer $before" }
          $cams = Invoke-RestMethod 'http://127.0.0.1:8765/api/cameras' -Headers $h
          if (-not ($cams.cameras | Where-Object id -eq 'ci_fire')) { throw 'camera lost on upgrade' }
          'upgrade OK'

      - name: Logs
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "$env:ProgramData\Sentinel\logs" -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramData\Sentinel\logs\sentinel.log" -Tail 40 -ErrorAction SilentlyContinue
          Get-Content "$env:ProgramData\Sentinel\logs\SentinelEngine.err.log" -Tail 40 -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\sentinel-install.log" -Tail 60 -ErrorAction SilentlyContinue

      - name: Uninstall
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File "$env:ProgramFiles\Sentinel\uninstall.ps1" -RemoveData
          Start-Sleep 5
          if (Get-Service SentinelEngine -ErrorAction SilentlyContinue) { throw 'service still present' }
          'uninstall OK'

      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-Windows-x64-offline
          path: build/Sentinel-Windows-x64.zip
          retention-days: 30
